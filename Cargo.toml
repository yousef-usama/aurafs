[workspace]
members = [
    "aurafs-core",
    "aurafs-daemon",
    "aurafs-cloud",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Yousef <yuseefosama67@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/yousef-usama/aurafs"

[workspace.dependencies]
# Async Runtime & Networking
tokio = { version = "1.42", features = ["full"] }
axum = { version = "0.8", features = ["json", "tokio"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }

# AWS SDK
aws-config = { version = "1.5", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.65"
aws-sdk-dynamodb = "1.58"
aws-sdk-sqs = "1.55"

# Serialization & Binary Formats
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
toml = "0.8"

# Crypto & Hashing
blake3 = "1.5"
hex = "0.4"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Local Cache & Storage
redb = "2.3"

# File System Events
notify = "8.0"

# Logging & Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error Handling & Utilities
thiserror = "2.0"
anyhow = "1.0"
async-trait = "0.1"
kamadak-exif = "0.6"
infer = "0.16"
