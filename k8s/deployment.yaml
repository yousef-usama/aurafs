apiVersion: apps/v1
kind: Deployment
metadata:
  name: aurafs-cloud
  namespace: aurafs
  labels:
    app.kubernetes.io/name: aurafs-cloud
    app.kubernetes.io/component: enrichment-worker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: aurafs-cloud
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aurafs-cloud
    spec:
      serviceAccountName: aurafs-cloud-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: aurafs-cloud
          image: 339712755065.dkr.ecr.eu-central-1.amazonaws.com/aurafs-cloud:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: aurafs-cloud-config
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 2
