apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aurafs-cloud-hpa
  namespace: aurafs
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aurafs-cloud
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
