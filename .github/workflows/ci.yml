name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  rust-checks:
    name: Rust Lint, Format & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Verify Code Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy Linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Execute Workspace Unit & Integration Tests
        run: cargo test --workspace --verbose

  terraform-security:
    name: Terraform Validation & Checkov Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.4

      - name: Check Terraform Formatting
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Initialize Terraform (Validation Mode)
        run: terraform -chdir=terraform init -backend=false

      - name: Validate Terraform Syntax & References
        run: terraform -chdir=terraform validate

      - name: Run Checkov IaC Security Scanner
        run: |
          pip install checkov
          checkov -d terraform/ --config-file terraform/.checkov.yaml
